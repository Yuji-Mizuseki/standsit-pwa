<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>コラ100運動アプリ</title>
  <link rel="manifest" href="/standsit-pwa/manifest.json" />
  <meta name="theme-color" content="#ffffff" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="コラ100運動" />
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700;900&display=swap');

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:      #ffffff;
      --bg2:     #003884;
      --primary: #003884;
      --primary2:#3f7bd0;
      --accent:  #5b8fd8;
      --text:    #1c2b45;
      --text-mid:#4d5d78;
      --text-dim:#8b9ab3;
      --white:   #ffffff;
      --shadow:  rgba(0,56,132,0.18);
    }

    html, body {
      min-height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: 'Noto Sans JP', sans-serif;
    }

    body {
      background:
        radial-gradient(ellipse at 85% 0%, rgba(255,160,0,0.10) 0%, transparent 45%),
        var(--bg);
    }

    .container {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 48px 28px 60px;
    }

    /* ヘッダー */

    .hero-logo {
      display: block; width: 100%; max-width: 230px; height: auto;
      margin: 0 auto 14px; border-radius: 24px;
      box-shadow: 0 6px 24px var(--shadow);
    }

    .hero-wrap {
      text-align: center;
      margin-bottom: 28px;
      animation: fadeUp .5s .05s both;
    }

    .hero-icon {
      font-size: 72px;
      line-height: 1;
      margin-bottom: 18px;
      display: block;
      animation: float 3.5s ease-in-out infinite;
    }

    @keyframes float {
      0%,100% { transform: translateY(0); }
      50%      { transform: translateY(-7px); }
    }

    .title {
      font-size: 30px;
      font-weight: 900;
      color: var(--text);
      line-height: 1.3;
      margin-bottom: 10px;
    }

    .subtitle {
      font-size: 16px;
      color: var(--text-mid);
      line-height: 1.7;
    }

    /* カード */

    .nav-cards {
      width: 100%;
      max-width: 360px;
      display: flex;
      flex-direction: column;
      gap: 18px;
    }

    .nav-card {
      display: flex;
      align-items: center;
      gap: 20px;
      padding: 26px 26px;
      background: var(--white);
      border: 2px solid transparent;
      border-radius: 24px;
      text-decoration: none;
      color: var(--text);
      box-shadow: 0 4px 20px var(--shadow);
      transition: all .22s cubic-bezier(.34,1.56,.64,1);
      animation: fadeUp .5s both;
    }

    .nav-card:nth-child(1) { animation-delay: .15s; }

    .nav-card:nth-child(2) { animation-delay: .25s; }

    .nav-card:nth-child(3) { animation-delay: .3s; }

    .nav-card:nth-child(4) { animation-delay: .35s; }

    .nav-card:active {
      transform: scale(.97);
      box-shadow: 0 2px 10px var(--shadow);
    }

    .nav-card.primary { border-color: rgba(0,56,132,.25); }

    .nav-card.primary:hover { border-color: var(--primary); box-shadow: 0 8px 32px var(--shadow); }

    .nav-card.secondary { border-color: rgba(91,143,216,.3); }

    .nav-card.secondary:hover { border-color: var(--accent); }

    .card-icon {
      font-size: 42px;
      flex-shrink: 0;
      width: 60px;
      height: 60px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 18px;
      background: var(--bg2);
    }

    .card-text { flex: 1; }

    .card-title {
      font-size: 20px;
      font-weight: 900;
      color: var(--text);
      margin-bottom: 5px;
    }

    .card-desc {
      font-size: 14px;
      color: var(--text-mid);
      line-height: 1.5;
    }

    .card-arrow {
      color: #ef6c00 !important;
      font-size: 22px;
      color: var(--primary2);
    }

    /* ホーム画面に追加ボタン */

    #installBtn {
      display: none;
      width: 100%;
      max-width: 360px;
      margin-top: 18px;
      padding: 18px;
      border: 2px solid var(--primary);
      border-radius: 100px;
      background: var(--white);
      color: var(--primary);
      font-size: 18px;
      font-weight: 900;
      font-family: 'Noto Sans JP', sans-serif;
      cursor: pointer;
      box-shadow: 0 4px 16px var(--shadow);
      transition: all .2s;
      animation: fadeUp .5s .35s both;
    }

    #installBtn:active { transform: scale(.97); }

    /* iOS向け説明バナー */

    #iosBanner {
      display: none;
      width: 100%;
      max-width: 360px;
      margin-top: 18px;
      padding: 16px 20px;
      background: var(--white);
      border: 2px solid rgba(0,56,132,.3);
      border-radius: 20px;
      font-size: 14px;
      color: var(--text-mid);
      line-height: 1.7;
      text-align: center;
      box-shadow: 0 4px 16px var(--shadow);
      animation: fadeUp .5s .35s both;
    }

    #iosBanner .ios-icon { font-size: 20px; vertical-align: middle; }

    /* 設定ボタン */

    .settings-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      margin-top: 14px;
      padding: 14px 24px;
      width: 100%;
      max-width: 360px;
      background: var(--white);
      border: 2px solid rgba(28,43,69,.12);
      border-radius: 100px;
      color: var(--text-mid);
      font-size: 16px; font-weight: 700;
      font-family: 'Noto Sans JP', sans-serif;
      text-decoration: none;
      box-shadow: 0 2px 12px rgba(0,0,0,.06);
      transition: all .2s;
      animation: fadeUp .5s .3s both;
    }

    .settings-btn:active { transform: scale(.97); }

    .footer {
      margin-top: 44px;
      font-size: 13px;
      color: var(--text-dim);
      text-align: center;
      animation: fadeUp .5s .4s both;
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(16px); }
      to   { opacity: 1; transform: translateY(0); }
    }
  
    /* ===== 濃い青の地（コラーゲン100ブルー）の上は白い文字・線 ===== */
    .card-icon { color: #fff; }

    /* ===== トップ v1.8（ChatGPT のデザイン案をもとに） ===== */
    body {
      background:
        radial-gradient(120% 60% at 0% 0%, rgba(63,123,208,.16) 0%, transparent 40%),
        radial-gradient(120% 50% at 100% 100%, rgba(255,160,0,.14) 0%, transparent 40%),
        #ffffff;
    }
    .container { justify-content: flex-start; padding-top: 28px; }
    .hero-wrap { margin-bottom: 16px; }
    .hero-logo { max-width: 230px; margin-bottom: 4px; border-radius: 0; box-shadow: none; filter: drop-shadow(0 6px 14px rgba(0,56,132,.22)); }
    .app-name {
      display: inline-block; font-size: 28px; font-weight: 900; color: #003884; letter-spacing: .02em;
      padding-bottom: 6px;
      background: linear-gradient(90deg, #ef6c00, #ffa000) left bottom / 60% 4px no-repeat;
    }
    /* 今日のひとこと（ハンコ数・継続日数） */
    .today-card {
      width: 100%; max-width: 380px; display: flex; align-items: center; gap: 14px;
      padding: 14px 18px; margin-bottom: 18px; border-radius: 22px;
      background: linear-gradient(135deg, #fff8e6, #fff1d6);
      border: 2px solid #ffd27a; box-shadow: 0 4px 16px rgba(239,108,0,.12);
    }
    .today-coin { width: 54px; height: 54px; flex-shrink: 0; }
    .today-msg { font-size: 17px; font-weight: 900; color: #003884; margin-bottom: 2px; }
    .today-nums { display: flex; align-items: baseline; gap: 14px; font-size: 15px; font-weight: 700; color: #1c2b45; }
    .today-nums b { font-size: 32px; font-weight: 900; color: #ef6c00; margin: 0 2px; line-height: 1; }
    .today-nums .sep { width: 1.5px; align-self: stretch; background: #ffd27a; }
    /* メニュー：大きなボタン */
    .menu { width: 100%; max-width: 380px; display: flex; flex-direction: column; gap: 14px; }
    .menu a {
      display: flex; align-items: center; gap: 16px; padding: 16px 18px; border-radius: 26px;
      color: #fff; text-decoration: none;
      background: linear-gradient(180deg, #1d5fc0 0%, #003884 100%);
      box-shadow: 0 6px 0 #00285e, 0 10px 20px rgba(0,56,132,.25);
      transition: transform .12s ease, box-shadow .12s ease;
    }
    .menu a:active { transform: translateY(4px); box-shadow: 0 2px 0 #00285e, 0 4px 10px rgba(0,56,132,.25); }
    .menu a.vit {
      background: linear-gradient(180deg, #ffa000 0%, #ef6c00 100%);
      box-shadow: 0 6px 0 #b84f00, 0 10px 20px rgba(239,108,0,.28);
    }
    .menu a.vit:active { box-shadow: 0 2px 0 #b84f00, 0 4px 10px rgba(239,108,0,.28); }
    .menu .mi { width: 56px; height: 56px; flex-shrink: 0; }
    .menu .mt { flex: 1; min-width: 0; }
    .menu .mt b { display: block; font-size: 24px; font-weight: 900; line-height: 1.2; }
    .menu .mt span { display: block; font-size: 13.5px; font-weight: 700; opacity: .92; margin-top: 2px; }
    .menu .ma { font-size: 30px; font-weight: 900; opacity: .9; }
    .footer { margin-top: 30px; }
  </style>
</head>
<body>
  <div class="container">
    <div class="hero-wrap">
      <img class="hero-logo" src="img/logo-v2.webp" width="640" height="640" alt="コラ100飲んで元気に歩こう（コラ100運動アプリ）">
    </div>

    <!-- 今日のひとこと：貯筋通帳の記録から（端末の中のデータ） -->
    <div class="today-card" id="todayCard">
      <svg class="today-coin" viewBox="0 0 54 54"><circle cx="27" cy="27" r="24" fill="#ffb300"/><circle cx="27" cy="27" r="18" fill="#ffc94d" stroke="#ef6c00" stroke-width="2"/><path d="M27 15l3.5 7.2 7.9 1.1-5.7 5.6 1.3 7.9L27 33.1l-7 3.7 1.3-7.9-5.7-5.6 7.9-1.1z" fill="#fff"/></svg>
      <div>
        <div class="today-msg" id="todayMsg">今日も貯筋しましょう！</div>
        <div class="today-nums"><span>ハンコ<b id="todayStamps">0</b>個</span><span class="sep"></span><span>継続<b id="todayStreak">0</b>日</span></div>
      </div>
    </div>

    <nav class="menu">
      <!-- 「運動を始める」（measure.html・いす座り立ち10回のテスト）はトップから外した。画面と記録は残してある（2026-11-26） -->
      <a href="kyokin.html"><svg class="mi" viewBox="0 0 56 56" fill="none" stroke="#fff" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 16V8h8M42 8h8v8M50 40v8h-8M14 48H6v-8" opacity=".85"/><circle cx="30" cy="14" r="4" fill="#fff" stroke="none"/><path d="M29 20l-3 12 6 6v8M26 32l-6 14M27 23l-8 5M30 22l9-5"/></svg><span class="mt"><b>貯筋運動</b><span>10種目をカメラで数えて採点</span></span><span class="ma">›</span></a>
      <a href="tsucho.html" class="vit"><svg class="mi" viewBox="0 0 56 56" fill="none" stroke="#fff" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M28 14c-6-4-14-4-20-2v30c6-2 14-2 20 2 6-4 14-4 20-2V12c-6-2-14-2-20 2z" fill="#fff" fill-opacity=".18"/><path d="M28 14v30"/><circle cx="39" cy="27" r="6" fill="#fff" stroke="none"/><circle cx="39" cy="27" r="3.4" fill="#ef6c00" stroke="none"/></svg><span class="mt"><b>貯筋通帳</b><span>運動とコラーゲンのハンコ</span></span><span class="ma">›</span></a>
      <a href="history.html"><svg class="mi" viewBox="0 0 56 56" fill="none" stroke="#fff" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 46h38"/><rect x="13" y="32" width="7" height="12" rx="1.5" fill="#fff"/><rect x="25" y="25" width="7" height="19" rx="1.5" fill="#fff"/><rect x="37" y="18" width="7" height="26" rx="1.5" fill="#fff"/><path d="M12 24l12-8 8 4 12-10M38 10h6v6" stroke="#ffd27a"/></svg><span class="mt"><b>記録を見る</b><span>これまでの記録を確認</span></span><span class="ma">›</span></a>
      <a href="settings.html"><svg class="mi" viewBox="0 0 56 56" fill="none" stroke="#fff" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="28" cy="28" r="7"/><path d="M28 8v6M28 42v6M8 28h6M42 28h6M13.9 13.9l4.2 4.2M37.9 37.9l4.2 4.2M13.9 42.1l4.2-4.2M37.9 18.1l4.2-4.2"/><circle cx="28" cy="28" r="15" stroke-width="3"/></svg><span class="mt"><b>設定</b><span>アプリの設定を変更</span></span><span class="ma">›</span></a>
    </nav>

    <!-- Android用インストールボタン -->
    <button id="installBtn">📲 ホーム画面に追加する</button>

    <!-- iOS用説明バナー -->
    <div id="iosBanner">
      <span class="ios-icon">📲</span> ホーム画面に追加するには<br>
      下の <strong>「共有」</strong> ボタン <span class="ios-icon">⬆️</span> をタップして<br>
      <strong>「ホーム画面に追加」</strong> を選んでください
    </div>

    <p class="footer">毎日少しずつ、続けることが大切です 🌸<br><span style="font-size:11px; color: var(--text-dim);">v1.8.1</span></p>
  </div>

  <script>
    // Service Worker登録・自動更新（オンラインモードのみ）
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('/standsit-pwa/sw.js').then(reg => {
        const appSettings = JSON.parse(localStorage.getItem('standsit-settings') || '{}');
        const netMode = appSettings.netMode || 'online';
        if (netMode === 'online') {
          reg.addEventListener('updatefound', () => {
            const newWorker = reg.installing;
            newWorker.addEventListener('statechange', () => {
              if (newWorker.state === 'activated') {
                window.location.reload();
              }
            });
          });
        }
      });
    }

    // Android: beforeinstallpromptイベントをキャッチ
    let deferredPrompt = null;
    const installBtn = document.getElementById('installBtn');
    const iosBanner  = document.getElementById('iosBanner');

    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      deferredPrompt = e;
      installBtn.style.display = 'block';
    });

    installBtn.addEventListener('click', async () => {
      if (!deferredPrompt) return;
      deferredPrompt.prompt();
      const { outcome } = await deferredPrompt.userChoice;
      if (outcome === 'accepted') {
        installBtn.style.display = 'none';
      }
      deferredPrompt = null;
    });

    // すでにインストール済みならボタンを隠す
    window.addEventListener('appinstalled', () => {
      installBtn.style.display = 'none';
    });

    // iOS Safari判定 → バナー表示
    const isIos = /iphone|ipad|ipod/i.test(navigator.userAgent);
    const isInStandaloneMode = window.matchMedia('(display-mode: standalone)').matches;
    if (isIos && !isInStandaloneMode) {
      iosBanner.style.display = 'block';
    }
  </script>

  <script src="/standsit-pwa/js/kyokin-exercises.js"></script>
  <script src="/standsit-pwa/js/tsucho-db.js"></script>
  <script>
    // 今日押したハンコの数と、運動が続いている日数（今日まだでも昨日まで続いていれば数える）
    (async () => {
      try {
        const all = (await TSUCHO.all()).filter(e => e.kind !== 'collagen');
        const today = TSUCHO.localDate(new Date());
        const days = new Set(all.map(e => e.date));
        const n = all.filter(e => e.date === today).reduce((a, e) => a + (e.stamps || 0), 0);
        let streak = 0;
        for (let d = new Date(); ; d.setDate(d.getDate() - 1)) {
          const k = TSUCHO.localDate(d);
          if (days.has(k)) streak++;
          else if (k === today) continue;
          else break;
        }
        document.getElementById('todayStamps').textContent = n;
        document.getElementById('todayStreak').textContent = streak;
        document.getElementById('todayMsg').textContent = n > 0 ? '今日もがんばりました！' : (streak > 0 ? '今日も続けましょう！' : '今日も貯筋しましょう！');
      } catch (e) { /* 記録が読めないときは初期表示のまま */ }
    })();
  </script>
</body>
</html>
